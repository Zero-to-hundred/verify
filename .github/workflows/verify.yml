# Z2H Verified — the pipeline the seller calls and cannot edit.
#
# THIS FILE DOES NOT BELONG IN A SELLER'S REPOSITORY. It is the source for
# `Zero-to-hundred/verify/.github/workflows/verify.yml`, published from a public
# Z2H repo and referenced by tag. A copy living in the repo being verified would
# be a copy the seller can change. See `guide/VERIFICATION.md`.
#
# What is and is not trusted here:
#
#   · The seller's SOURCE is the subject. Verifying it is the point.
#   · The seller's SCRIPTS are not trusted, and no step below invokes one.
#     `pnpm verify` and `pnpm accept:all` are entries in their `package.json`;
#     redefining `verify` as `exit 0` is a one-line change. Every step runs the
#     underlying tool directly, by path. This is why `package.json#scripts` and
#     `turbo.json` are NOT in the integrity manifest — nothing they contain can
#     change the outcome, so hashing them would only punish a buyer for adding a
#     `deploy` script.
#   · The seller's KIT MANIFEST is not trusted. Canonical hashes are fetched
#     from Z2H by the compose tool, never read from the checkout.
#   · The RUNNER and the COMPOSE TOOL are not the seller's either. Both are
#     checked out from this repository into `.z2h-verify/` and executed from
#     there, so the code that decides whether a feature passed its spec — and
#     the code that writes the attestation — are Z2H's, at this tag. Nothing is
#     published to npm; the git tag is the pin.
#   · Turbo is bypassed entirely rather than merely forced: a cached task
#     replays a previous pass without running anything, and its config is the
#     seller's.
# THE JOB BUDGET: 60 minutes, set on the job below. GitHub does not allow an
# expression in `timeout-minutes`, so it cannot be a constant — it is documented
# here instead, because the number is a decision and not a guess.
#
# A cold run spends roughly: install 2-3 min, Playwright browsers 1-2 min, setup
# under a minute, verify 8-12 min (a Next build plus typecheck, lint, unit tests,
# contrast), acceptance 10-15 min against a real Postgres, e2e 6-10 min for 58
# browser tests, grade 1-2 min. Call it 30-45 minutes, with headroom for a slow
# runner.
#
# Raising it is usually right when a seller's suite has grown. Lowering it is
# usually wrong: a run cancelled at the deadline produces no attestation at all,
# which reads as "nothing happened" rather than as a failure, and that is how
# run 6 of the proving sequence was lost.
name: z2h-verify

on:
  workflow_call:
    inputs:
      kit-version:
        description: The kit version the listing declares, from listing.config.ts.
        required: true
        type: string
      z2h-origin:
        description: Where the canonical kit manifests are served.
        required: false
        type: string
        default: https://zerotohundred.ai

# One run per ref. A seller pushing three commits in a minute gets one
# verification of the newest, not three pipelines they pay for.
concurrency:
  group: z2h-verified-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The only permission signing needs: the job's OIDC token is the identity
  # Sigstore binds the certificate to. `attestations: write` is gone with
  # `attest-build-provenance` — see the signing step for why.
  id-token: write

env:
  # The tag this workflow is published under. Used twice: to check out the
  # verifier's own code, and to state the identity the signature must carry.
  # **Bump it in the same commit that moves the tag.**
  VERIFY_REF: v0

jobs:
  verify:
    runs-on: ubuntu-latest
    # See "THE JOB BUDGET" in the header for what this is sized against.
    timeout-minutes: 60

    # Acceptance runs against a real database, not an embedded one: the claim is
    # that the feature works, and a fake would be verifying the fake.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: z2h
          POSTGRES_DB: z2h_accept
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout the seller's repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The verifier's own code, from this repository at this tag.
      #
      # `ref` is a literal rather than `${{ github.workflow_ref }}` (which is a
      # workflow path with a ref appended, not a git ref) and rather than a
      # caller input: an input would let a seller ask for an older, weaker tag
      # while still appearing to call the current one. It is Z2H's repo either
      # way, so the risk is downgrade rather than substitution — but a downgrade
      # is enough. **Bump this line in the same commit that moves the tag.**
      - name: Checkout the verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Zero-to-hundred/verify
          ref: ${{ env.VERIFY_REF }}
          path: .z2h-verify
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install the seller's dependencies
        run: pnpm install --frozen-lockfile

      # The verifier's own, resolved separately so the seller's lockfile cannot
      # decide what the runner or the compose tool are made of.
      # `--ignore-workspace` is load-bearing. `.z2h-verify` sits inside the
      # seller's checkout, so without it pnpm walks up, finds their
      # `pnpm-workspace.yaml`, and installs *their* workspace instead — reporting
      # "Scope: all 9 workspace projects" and leaving the verifier's own
      # dependencies uninstalled, which then fails as ERR_MODULE_NOT_FOUND.
      #
      # No `--frozen-lockfile`: a lockfile cannot exist for these, because the
      # `link:` targets only exist inside a seller's checkout. Every registry
      # dependency is pinned to an exact version instead, which is the part a
      # lockfile would have been doing here.
      - name: Install the verifier's dependencies
        run: |
          pnpm --dir .z2h-verify/acceptance install --ignore-workspace
          pnpm --dir .z2h-verify/compose install --ignore-workspace

      - run: pnpm exec playwright install --with-deps chromium

      # ---- the six claims, each a direct invocation -----------------------
      #
      # `continue-on-error` on every one: a red step is a RESULT the attestation
      # must record, not a reason to abandon the run. An attestation that says
      # `verify: false` is exactly as useful as one that says true.

      - name: setup
        id: setup
        continue-on-error: true
        run: pnpm exec tsx tooling/setup.ts

      - name: verify
        id: verify
        continue-on-error: true
        run: |
          set -e
          pnpm exec tsx tooling/lint-schema.ts
          # Next generates route types (`LayoutProps` and friends) into
          # `.next/types` during a build, and `tsc` cannot see them before one.
          # The kit's own `typecheck` gets this from turbo's `dependsOn: ^build`;
          # invoking tsc directly has to ask for the build itself.
          pnpm --filter @jetpack/web exec next build
          pnpm -r exec tsc --noEmit
          # Explicit paths, not `.`: the verifier is checked out at
          # `.z2h-verify/` inside the workspace, and `biome check .` linted
          # Z2H's own vendored files, failing the seller's verify step on our
          # formatting. A tool pointed at "everything" finds the referee too.
          pnpm exec biome check apps packages tooling design e2e z2h
          pnpm --filter @jetpack/web exec vitest run --retry=0
          pnpm exec tsx tooling/check-dead-utilities.mts
          pnpm exec tsx design/check.ts

      - name: acceptance
        id: acceptance
        continue-on-error: true
        env:
          # `ACCEPT_DATABASE_URL`, not `DATABASE_URL`: the runner ignores the
          # latter on purpose so an acceptance run can never touch a real
          # database. This is the explicit opt-in, and it is what keeps embedded
          # PGlite out of the way — `next dev` opens it from several module
          # realms at once and it aborts, failing every write with a 500.
          ACCEPT_DATABASE_URL: postgres://postgres:z2h@localhost:5432/z2h_accept
        # Z2H's runner, from `.z2h-verify`, against the seller's workspace and
        # their own per-feature `accept.ts` specs. `JETPACK_PROJECT_ROOT` names
        # the tree under test rather than letting the runner walk up from its own
        # location and find whichever root is nearer.
        # Absolute paths, because `pnpm --dir` does not move the cwd that tsx
        # resolves `--tsconfig` against — a relative path was looked up at the
        # workspace root and failed with "Cannot resolve tsconfig at path".
        #
        # The config itself is vendored and self-contained: it inherits nothing
        # from the seller, since `paths` is a resolution table and an inherited
        # one could redirect what the referee loads.
        run: |
          JETPACK_PROJECT_ROOT="$GITHUB_WORKSPACE" \
            pnpm --dir .z2h-verify/acceptance exec \
              tsx --tsconfig "$GITHUB_WORKSPACE/.z2h-verify/acceptance/tsconfig.run.json" \
                  "$GITHUB_WORKSPACE/.z2h-verify/acceptance/src/cli.ts" --all

      - name: e2e
        id: e2e
        continue-on-error: true
        # `--retries=0` on the command line, where it overrides the config: a
        # test that only passes on a second attempt has not passed. Retries are
        # a reasonable habit in a seller's own CI and the wrong setting here,
        # because this run is evidence rather than feedback.
        run: pnpm exec playwright test --retries=0

      - name: grade
        id: grade
        continue-on-error: true
        run: pnpm exec tsx tooling/grade.ts --strict

      # ---- compose, sign, publish ----------------------------------------
      #
      # No `continue-on-error` from here down. A failure to compose or sign is a
      # failure to produce evidence, which is different from evidence of failure.

      - name: Compose the attestation
        # Z2H's compose tool, from `.z2h-verify`. Not npm: the git tag is the
        # pin, and a buyer can read the whole pipeline in one public repo.
        run: |
          pnpm --dir .z2h-verify/compose exec tsx src/cli.ts compose \
            --root "$GITHUB_WORKSPACE" \
            --setup-exit      "${{ steps.setup.outcome == 'success' && '0' || '1' }}" \
            --verify-exit     "${{ steps.verify.outcome == 'success' && '0' || '1' }}" \
            --acceptance-exit "${{ steps.acceptance.outcome == 'success' && '0' || '1' }}" \
            --e2e-exit        "${{ steps.e2e.outcome == 'success' && '0' || '1' }}" \
            --manifest-url "${{ inputs.z2h-origin }}/kits/jetpack/${{ inputs.kit-version }}/manifest.json" \
            --kit jetpack \
            --kit-version "${{ inputs.kit-version }}" \
            --grade-file .jetpack/grade.json \
            --commit "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --out attestation.json

      # Signed with cosign against the public Sigstore, not with
      # `actions/attest-build-provenance`.
      #
      # GitHub's attestation store refuses user-owned private repositories
      # outright — "Feature not available for user-owned private repositories" —
      # and that is exactly what a seller has. Sigstore has no such rule, and the
      # trust model is unchanged: the same Fulcio certificate, carrying the same
      # extensions, including the Source Repository Owner Identifier that proves
      # which account owns the code. Keyless, from the job's OIDC token; there is
      # no key and no secret anywhere in this workflow.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign the attestation
        run: cosign sign-blob --yes --bundle attestation.json.sigstore attestation.json

      # Verify our own signature before handing it to anyone. A bundle that does
      # not verify must fail the run that made it, not the seller's publish an
      # hour later — by then the failure looks like their fault.
      #
      # The identity is built from VERIFY_REF rather than `github.workflow_ref`,
      # which in a called workflow resolves to the *caller's* entry workflow. The
      # certificate's SAN is this reusable workflow, which is the whole point.
      - name: Verify our own signature
        run: |
          cosign verify-blob \
            --bundle attestation.json.sigstore \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/Zero-to-hundred/verify/.github/workflows/verify.yml@refs/tags/${{ env.VERIFY_REF }}" \
            attestation.json

      # A failed e2e step costs the seller their badge, so they have to be able
      # to find out why. Without this the only evidence is a log line.
      - name: Publish the browser report when e2e failed
        if: steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      # `continue-on-error` makes a step's *conclusion* `success` even when it
      # failed; only `outcome` carries the truth, and the REST API does not
      # expose it. Writing it here puts the real result on the run page, where
      # reading the wrong field is no longer possible.
      - name: Summarise what actually passed
        if: always()
        run: |
          {
            echo "| Claim | Outcome |"
            echo "|---|---|"
            echo "| setup | ${{ steps.setup.outcome }} |"
            echo "| verify | ${{ steps.verify.outcome }} |"
            echo "| acceptance | ${{ steps.acceptance.outcome }} |"
            echo "| e2e | ${{ steps.e2e.outcome }} |"
            echo "| grade | ${{ steps.grade.outcome }} |"
            echo ""
            echo "_A failing claim is recorded in the attestation, not hidden._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the attestation and its bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: z2h-verified
          path: |
            attestation.json
            attestation.json.sigstore
          if-no-files-found: error
